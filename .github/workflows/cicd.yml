name: Build and Publish Subagents

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyyaml
      - name: Generate and validate
        env:
          BLAZIUM_SKILLS_MARKETPLACE: https://raw.githubusercontent.com/blazium-games/blazium-skills/main/.claude-plugin/marketplace.json
        run: |
          python scripts/generate_agents.py
          python scripts/validate_agents.py

  resolve-version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      simple_version: ${{ steps.finalize.outputs.simple_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version with Bioblaze/game-semver-action
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize version (0.1.0 baseline + CDN monotonic)
        id: finalize
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CANDIDATE="${GITHUB_REF#refs/tags/v}"
          else
            COMPUTED="${{ steps.version.outputs.simple_version }}"
            BASE="0.1.0"
            CDN_LATEST="$(curl -fsSL https://cdn.blazium.app/subagents/subagents.json | jq -r '.latest // empty' || true)"
            if [[ "$CDN_LATEST" == "null" ]]; then
              CDN_LATEST=""
            fi
            CANDIDATE="$(printf '%s\n%s\n' "$COMPUTED" "$BASE" | sort -V | tail -n1)"
            bump_patch() {
              local v="$1" major minor patch
              IFS=. read -r major minor patch <<< "$v"
              patch="${patch%%[^0-9]*}"
              echo "${major}.${minor}.$((patch + 1))"
            }
            if [[ -n "$CDN_LATEST" ]]; then
              HIGHER="$(printf '%s\n%s\n' "$CANDIDATE" "$CDN_LATEST" | sort -V | tail -n1)"
              if [[ "$HIGHER" == "$CDN_LATEST" ]]; then
                CANDIDATE="$(bump_patch "$CDN_LATEST")"
              fi
            fi
            echo "computed=${COMPUTED} base=${BASE} cdn_latest=${CDN_LATEST:-none} => ${CANDIDATE}"
          fi
          test -n "$CANDIDATE"
          echo "simple_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"

  pack-claude:
    needs: [validate, resolve-version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Claude agents
        run: |
          VER="${{ needs.resolve-version.outputs.simple_version }}"
          STAGE="blazium-subagents-claude-${VER}"
          mkdir -p "${STAGE}"
          cp -a agents mapping.yaml scripts templates README.md LICENSE GETTING-STARTED.md CONTRIBUTING.md SECURITY.md AGENTS.md "${STAGE}/"
          mkdir -p "${STAGE}/.claude"
          cp -a .claude/skills "${STAGE}/.claude/skills"
          zip -r "${STAGE}.zip" "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: claude
          path: blazium-subagents-claude-*.zip

  pack-cursor:
    needs: [validate, resolve-version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Cursor agents
        run: |
          VER="${{ needs.resolve-version.outputs.simple_version }}"
          STAGE="blazium-subagents-cursor-${VER}"
          mkdir -p "${STAGE}/.cursor/agents"
          cp -a agents mapping.yaml scripts templates README.md LICENSE GETTING-STARTED.md CONTRIBUTING.md SECURITY.md AGENTS.md "${STAGE}/"
          cp -a agents/. "${STAGE}/.cursor/agents/"
          zip -r "${STAGE}.zip" "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: cursor
          path: blazium-subagents-cursor-*.zip

  pack-codex:
    needs: [validate, resolve-version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Codex agents
        run: |
          VER="${{ needs.resolve-version.outputs.simple_version }}"
          STAGE="blazium-subagents-codex-${VER}"
          mkdir -p "${STAGE}/.codex/agents" "${STAGE}/.agents/agents"
          cp -a agents mapping.yaml scripts templates README.md LICENSE GETTING-STARTED.md CONTRIBUTING.md SECURITY.md AGENTS.md "${STAGE}/"
          cp -a agents/. "${STAGE}/.codex/agents/"
          cp -a agents/. "${STAGE}/.agents/agents/"
          zip -r "${STAGE}.zip" "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: codex
          path: blazium-subagents-codex-*.zip

  publish:
    needs: [resolve-version, pack-claude, pack-cursor, pack-codex]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude
          path: dist/claude
      - uses: actions/download-artifact@v4
        with:
          name: cursor
          path: dist/cursor
      - uses: actions/download-artifact@v4
        with:
          name: codex
          path: dist/codex

      - name: Require every pack and write subagents.json
        env:
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          hosts = {}
          for host in ("claude", "cursor", "codex"):
              matches = list(Path("dist", host).glob("*.zip"))
              if len(matches) != 1:
                  raise SystemExit(f"{host}: expected 1 zip, found {matches}")
              data = matches[0].read_bytes()
              hosts[host] = {
                  "file": matches[0].name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
          catalog = {
              "latest": version,
              "versions": {
                  version: {
                      "hosts": hosts,
                  }
              },
          }
          Path("subagents.json").write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: dist/claude
          out_dir: subagents/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: dist/cursor
          out_dir: subagents/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: dist/codex
          out_dir: subagents/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: subagents.json
          out_dir: subagents

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: subagents.json
          out_dir: subagents/${{ needs.resolve-version.outputs.simple_version }}

      - name: Register with Cerebro
        env:
          CEREBRO_URL: ${{ secrets.CEREBRO_URL }}
          BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          version = os.environ["VERSION"]
          catalog = json.load(open("subagents.json", encoding="utf-8"))
          hosts = catalog["versions"][version]["hosts"]
          url = os.environ["CEREBRO_URL"].rstrip("/") + "/api/v1/tools"
          auth = os.environ["BLAZIUM_AUTH"]
          released = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          for host, meta in hosts.items():
              body = {
                  "name": "Blazium Subagents",
                  "type": "subagents",
                  "version": version,
                  "os": host,
                  "arch": "pack",
                  "file": f"https://cdn.blazium.app/subagents/{version}/{meta['file']}",
                  "sig": "",
                  "sha256": meta["sha256"],
                  "size": meta["size"],
                  "signing": "",
                  "released_on": released,
              }
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={
                  "Content-Type": "application/json",
                  "BLAZIUM_AUTH": auth,
              })
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(host, resp.status)
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          TAG="v${VER}"
          mapfile -t FILES < <(find dist -type f -name '*.zip' | sort)
          test "${#FILES[@]}" -eq 3
          NOTES="Blazium Subagents ${VER}

          | Host | Zip |
          |------|-----|
          | Claude | \`blazium-subagents-claude-${VER}.zip\` |
          | Cursor | \`blazium-subagents-cursor-${VER}.zip\` |
          | Codex | \`blazium-subagents-codex-${VER}.zip\` |

          CDN: https://cdn.blazium.app/subagents/subagents.json
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "Blazium Subagents ${VER}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
