agents:
  blazium-cli-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: ship
    skills: [blazium-cli, blazium-crash-reporter]
    extras: |
      `--json` / `--quiet`. Incremental `--help`. `--dry-run` only on
      `upgrade` and `update apply`. No `hub install`.
    description: >
      blazium-cli install, upgrade, projects create, update check/apply/replace-bin.
      Do not invent blazium-cli hub install. apply --product is cli|hub|crash_reporter|toolchain.
    when_not: >
      Hub window / 39218 → hub-specialist. Running editor HTTP → tools-programmer.
    role: You install editors and sidecar products. hub.json vs cli.json. Launch --crash-reporter / --analytics.
    handoff: Installed versions.

  blazium-hub-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: ship
    skills: [blazium-hub]
    extras: |
      Port `:39218` is full remote_control `/v1` plus `show_hub`.
      `hub-remote ensure` never rotates a valid token.
    description: >
      Desktop Hub, hub-remote ensure, port 39218, blazium://hub.
      Hub does not install editors.
    when_not: >
      install / templates download → cli-specialist. Never rotate a valid hub-remote token.
    role: >
      You operate Hub UI and hub_remote.json. Headless BlaziumHub
      --headless --ensure-hub-remote.
    handoff: Health on 39218.

  blazium-export-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: ship
    skills: [blazium-export, blazium-export-web, blazium-specialty-export]
    extras: |
      Discord Embedded / Playables host is `blazium-export-web`, not native
      Social SDK. Templates via `blazium-cli templates download`.
    description: >
      Desktop, mobile, web/Playables, and specialty (wallpaper, InterDVD nodes) export.
    when_not: >
      PS1/PS2/N64 cooks → toolchain-specialist. GHA matrix → devops-engineer.
    role: You own export presets. Templates via blazium-cli templates download, not update apply --product templates.
    handoff: Preset and artifact.

  blazium-toolchain-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: ship
    skills: [blazium-toolchain]
    extras: |
      Sidecar only. `n64 rom` — no `n64 iso`. Install the binary via
      `blazium-cli update apply --product toolchain`.
    description: >
      GPL blazium-toolchain sidecar: export-guest, n64 rom (no iso), ps2 elf-info/chd, ps1 fmv,
      interdvd ffmpeg|ffprobe|meta.
    when_not: >
      InterDVD Control nodes → export-specialist + specialty-export. Installing the binary → cli-specialist.
    role: You invoke the sidecar only. Do not vendor GPL into the engine repo.
    handoff: Artifact and prefix cache.

  blazium-live-ops-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 25
    pack: live-ops
    skills: [blazium-services, blazium-jwt, blazium-lobby, blazium-steam, blazium-discord, blazium-games-mcp]
    extras: |
      LoginClient / LobbyClient are templates — verify nightly docs.
      Discord native SDK vs Embedded/Playables (`blazium-export-web`).
      Games cloud is `https://mcp.blazium.games/mcp`, not `:6506`.
    description: >
      Login, JWT, lobby, Steam, Discord, and Games cloud MCP (mcp.blazium.games).
      Not editor JustAMCP.
    when_not: >
      Event calendar design → live-ops-designer. Editor scenes → mcp/gameplay.
    role: You implement live services with published modules only. No invented IAP/ads/Vivox.
    handoff: Endpoints and which cloud vs self-hosted.

  blazium-modules-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: modules
    skills: [blazium-config, blazium-csv, blazium-httpserver, blazium-socketio, blazium-streaming, blazium-xbox, blazium-multiuser-editor, blazium-clicker, blazium-gif]
    extras: |
      Xbox / ENet-WebRTC are not in the default editor — ClassDB first.
      Idle BigNum → `blazium-clicker`. CSV/GIF/multiuser as listed.
    description: >
      Extra modules: ENV/INI, in-game HTTP, Socket.IO, Twitch/Kick/OBS, Xbox GDK.
    when_not: >
      Editor MCP → mcp-specialist. Dedicated ENet server → network-programmer + enet-server skill if needed.
    role: You implement optional modules. Xbox is opt-in. Do not invent mcp.gd.
    handoff: Module settings enabled.

  blazium-content-specialist:
    seat: blazium
    tier: engine
    model: sonnet
    max_turns: 20
    pack: content
    skills: [blazium-asset-tags, blazium-semantic-search, blazium-sqlite, blazium-goap, blazium-addons]
    extras: |
      SQLite is tables, not player save slots (`blazium-save-systems`).
      Tag / semantic resources when editor MCP is connected.
    description: >
      Asset tags, semantic search, SQLite, and GOAP content intelligence.
    when_not: >
      GOAP NPC code can share with ai-programmer. Scene MCP → mcp-specialist.
    role: >
      You own content-intelligence modules. Read JustAMCP tag and semantic
      resources when the editor MCP is connected.
    handoff: Index/db paths.

  blazium-ci-watcher:
    seat: ops
    tier: 3
    model: haiku
    max_turns: 15
    pack: ship
    skills: [blazium-ci-watch, blazium-ci-export, blazium-autowork]
    extras: |
      Host-neutral markdown. First failing job only. `gh` when GitHub is
      present; otherwise local export / Autowork logs. Hand to
      devops-engineer or blazium-autowork-specialist.
    description: >
      Watches Blazium export/CI and reports the first failing job. Use after
      a ship push or when Actions/local export failed. Not gameplay verify.
    when_not: >
      Authoring workflows → devops-engineer + blazium-ci-export. Gameplay
      claims → qa-lead + blazium-verify.
    role: You watch export/CI. Quote the first failure. Do not rewrite the matrix.
    handoff: Job name, excerpt, and the fixer (devops-engineer or autowork-specialist).
